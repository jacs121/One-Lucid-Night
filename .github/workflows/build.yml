name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
      body:
        description: "Release description"
        default: ""

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
            platform: macos

          - os: macos-13
            name: macos-x86_64
            platform: macos

          - os: ubuntu-latest
            name: linux
            platform: linux

          - os: windows-latest
            name: windows
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          # Prevent architecture-mismatched Panda3D wheels
          python -m pip uninstall -y panda3d panda3d-gltf ursina || true

          python -m pip install --no-cache-dir -r requirements.txt

          python -c "import platform; print('Architecture:', platform.machine())"

      - name: Build
        shell: bash
        run: |
          chmod +x build.sh
          python -m PyInstaller --version

          bash build.sh ${{ matrix.platform }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            releases/*.tar.gz
            releases/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-files

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.body }}
          files: |
            release-files/*.tar.gz
            release-files/*.zip
          generate_release_notes: true